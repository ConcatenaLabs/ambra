# The Rust core's offline tests, then the app's analyzer and host tests, on every pull request
# and on main, with the toolchains the release build uses (Rust 1.96.0, Flutter 3.44.3 stable).
#
# ambra_core reaches SWK and seqln through sibling paths (`../../SWK`, `../../seqln`), so both
# are checked out beside this repository at their default branches. sequentia-faucet is checked
# out too: app/test/faucet_once_test.dart reads its ledger code through FAUCET_DIR.
#
# Not run here, by design (CLAUDE.md, "Build and test"):
# - SKIPPED (needs a sequentiad): the core's stake_records, contracts and issuance tests.
# - SKIPPED (needs the live testnet): the core's sync and swap_repro tests.
# - SKIPPED (needs an arca operator harness): the leaves cases; the test passes without one.
# - SKIPPED (needs a device or emulator): app/integration_test/.
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
jobs:
  core-and-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: ambra
      - uses: actions/checkout@v4
        with:
          repository: ConcatenaLabs/SWK
          ref: sequentia
          path: SWK
      - uses: actions/checkout@v4
        with:
          repository: ConcatenaLabs/seqln
          ref: sequentia-stable
          path: seqln
      - uses: actions/checkout@v4
        with:
          repository: ConcatenaLabs/sequentia-faucet
          path: sequentia-faucet
      - name: protoc (the arca library's build needs it)
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ambra/ambra_core -> target
      - name: build the core (the cdylib the app's host tests load)
        working-directory: ambra/ambra_core
        run: cargo build
      - name: core tests (offline)
        working-directory: ambra/ambra_core
        run: >
          cargo test --lib
          --test smoke --test signer_conformance --test payment_limit
          --test seqob_relay_offer --test seqob_resting_offer --test leaves
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: the faucet's dependencies (faucet_once_test starts its server)
        working-directory: sequentia-faucet
        run: npm ci || npm install --no-audit --no-fund
      - name: flutter pub get
        working-directory: ambra/app
        run: flutter pub get
      - name: flutter analyze
        working-directory: ambra/app
        run: flutter analyze
      - name: flutter test (host)
        working-directory: ambra/app
        env:
          AMBRA_CORE_LIB: ${{ github.workspace }}/ambra/ambra_core/target/debug/libambra_core.so
          FAUCET_DIR: ${{ github.workspace }}/sequentia-faucet
        run: flutter test test/
